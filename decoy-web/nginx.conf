events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_body_buffer_size 32k;
    client_max_body_size 1m;

    log_format honeypot_json escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"host":"$host",'
        '"user_agent":"$http_user_agent",'
        '"referer":"$http_referer",'
        '"post_data":"$request_body"}';

    upstream opencanary_http {
        server opencanary:8080;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        access_log /var/log/nginx/access.log honeypot_json;
        error_log /var/log/nginx/error.log warn;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;

        location = / {
            try_files /index.html =404;
        }

        location = /dydaktyka-g/materialy-dla-studentow {
            try_files /index.html =404;
        }

        location = /login {
            proxy_pass http://opencanary_http/login;
            proxy_http_version 1.1;
            proxy_pass_request_body on;
            proxy_set_header Content-Type $content_type;
            proxy_set_header Content-Length $content_length;
        }

        location = /admin {
            mirror /__canary/admin;
            default_type text/html;
            return 200 '<!doctype html><html><head><title>Admin Console</title></head><body><h1>Administrative Console</h1><p>Access restricted to enrolled university devices.</p><form method="post" action="/login"><input name="username" placeholder="administrator"><input name="password" type="password" placeholder="password"><button>Continue</button></form></body></html>';
        }

        location = /wp-login.php {
            mirror /__canary/wp-login.php;
            default_type text/html;
            return 200 '<!doctype html><html><head><title>WordPress Login</title></head><body><h1>Northbridge Newsroom</h1><form method="post" action="/login"><label>Username <input name="username"></label><label>Password <input name="password" type="password"></label><button>Log In</button></form></body></html>';
        }

        location = /phpmyadmin {
            mirror /__canary/phpmyadmin;
            default_type text/html;
            return 200 '<!doctype html><html><head><title>phpMyAdmin</title></head><body><h1>phpMyAdmin</h1><p>MySQL server: student-db.internal</p><form method="post" action="/login"><input name="username" value="root"><input name="password" type="password"><button>Go</button></form></body></html>';
        }

        location = /.env {
            mirror /__canary/.env;
            default_type text/plain;
            return 200 'APP_ENV=production\nAPP_DEBUG=false\nDB_HOST=student-db.internal\nDB_DATABASE=student_portal\nDB_USERNAME=portal_admin\nDB_PASSWORD=ChangeMe2024!\nS3_BUCKET=nbu-backups-private\n';
        }

        location = /config.php {
            mirror /__canary/config.php;
            default_type text/plain;
            return 200 '<?php\ndefine("DB_HOST", "student-db.internal");\ndefine("DB_USER", "portal_admin");\ndefine("DB_PASS", "ChangeMe2024!");\ndefine("DB_NAME", "student_portal");\ndefine("BACKUP_PATH", "/srv/backups/nightly");\n';
        }

        location = /backup.zip {
            mirror /__canary/backup.zip;
            default_type application/zip;
            add_header Content-Disposition 'attachment; filename="backup.zip"';
            return 200 "PK\003\004fake-student-portal-backup.zip\n";
        }

        location = /api/v1/users {
            mirror /__canary/api/v1/users;
            default_type application/json;
            return 200 '{"users":[{"id":1001,"username":"admin","role":"administrator","mfa":false},{"id":1042,"username":"jsmith","role":"finance","mfa":true},{"id":1188,"username":"helpdesk","role":"support","mfa":false}]}';
        }

        location /__canary/ {
            internal;
            proxy_pass http://opencanary_http/;
            proxy_http_version 1.1;
            proxy_pass_request_body on;
            proxy_set_header Content-Type $content_type;
            proxy_set_header Content-Length $content_length;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
